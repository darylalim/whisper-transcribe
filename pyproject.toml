[project]
name = "whisper-transcribe"
version = "0.11.0"
description = "Streamlit application for transcription and translation using OpenAI Whisper on Apple Silicon with MLX."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Direct, not transitive-via-mlx-whisper: streamlit_app imports mlx.core to
    # call mx.clear_cache() after each batch. mlx-whisper would pull it in
    # regardless, but an undeclared import breaks the moment that stops being true.
    # The floor is a real API minimum, not caution: mx.clear_cache() does not exist
    # at 0.22.1 (checked directly, along with 0.20.0), and does at 0.24.2. 0.23.0
    # is untested because it ships no cp313 wheel, so the floor is the lowest
    # version actually confirmed rather than the lowest that might work.
    # It is not a typing floor either: ty resolves `import mlx.core` through the
    # mlx/core/*.pyi stubs that most releases ship (0.32.0 did not), against the
    # locked version, not this one -- see the comment above that import.
    "mlx>=0.24.2",
    "mlx-whisper",
    # Direct for the same reason as mlx: streamlit_app calls
    # huggingface_hub.snapshot_download itself, to probe the weight cache offline
    # before the first model pass and label the first-run download. mlx-whisper
    # depends on it unpinned. snapshot_download(local_files_only=) and
    # huggingface_hub.errors.LocalEntryNotFoundError exist well below this floor
    # (checked at 0.30.0 and 1.0.0); 1.22 is where the offline probe starts to
    # see a *partial* snapshot -- an interrupted first run -- as a miss
    # (_raise_if_incomplete_snapshot, IncompleteSnapshotError, absent at 1.21.0),
    # so below it a resumed download runs unlabelled, the exact gap the label
    # closes. The lock is 1.31.0, and py.typed ships at every version checked.
    "huggingface-hub>=1.22",
    "streamlit>=1.59",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "watchdog",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.environment]
python-version = "3.12"
